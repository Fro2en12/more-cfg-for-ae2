plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = neoforge_version

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
        }
        client {
            client()
        }
        server {
            server()
            programArguments.addAll '--nogui'
        }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // JEC 内嵌的 PinIn 拼音库（Maven Central 无该坐标，从 JEC jar 提取到 libs/）
    flatDir {
        dir 'libs'
    }
    maven {
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "JEI"
        url = "https://maven.blamejared.com/"
        content {
            includeGroup "mezz.jei"
        }
    }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    mavenCentral()
}

dependencies {
    implementation "net.neoforged:neoforge:${neoforge_version}"

    // Mixin 注解处理器（NeoForge 1.21 运行时自带 Mixin 0.8.7）
    compileOnly "org.spongepowered:mixin:0.8.7"
    annotationProcessor "org.spongepowered:mixin:0.8.7:processor"

    // 核心依赖
    implementation "maven.modrinth:ae2:19.2.17"
    implementation "maven.modrinth:guideme:21.1.17"
    // configuration 3.1.1 在 Modrinth 有 Forge/NeoForge 双文件，用版本 ID 锁定 NeoForge 版
    implementation "maven.modrinth:configuration:6Mztfq1u"
    implementation "maven.modrinth:extended-ae:1.21-2.2.29-neoforge"
    implementation "maven.modrinth:merequester:1.21.1-1.4.3+neoforge"

    // 可选兼容（编译必需，运行时按 LoadedMods 检测）
    implementation "maven.modrinth:appflux:1.21-2.1.4-neoforge"
    implementation "maven.modrinth:applied-mekanistics:1.6.3"
    implementation "maven.modrinth:mekanism:10.7.19.85"

    // Applied Botanics 1.21.1 依赖 Botania 454-SNAPSHOT（尚未正式发布），
    // 编译期提供 ManaKey API，运行时由用户按需自备（appbot + botania）
    compileOnly "maven.modrinth:applied-botanics:1.6.0-alpha.3"

    // Ars Energistique 2.1.1-beta 需 Ars Nouveau + curios + geckolib 整套运行时，
    // 作为可选兼容仅编译期提供 SourceKey API，运行时由用户按需自备（arseng + ars_nouveau）
    compileOnly "maven.modrinth:ars-energistique:2.1.1-beta"

    // ExtendedAE / AppFlux 的运行时依赖（Modrinth Maven 不提供传递依赖）
    runtimeOnly "maven.modrinth:glodium:1.21-2.2-neoforge"

    // JEI（编译 API + 运行）
    compileOnly "mezz.jei:jei-1.21.1-neoforge:19.43.0.390"
    runtimeOnly "mezz.jei:jei-1.21.1-neoforge:19.43.0.390"

    // PinIn 拼音库由 JEC 以 jarjar 形式提供（本 mod 通过反射调用，见 JeCharactersCompat）。
    // 这里仅编译期使用本地 libs jar，运行时不重复打包，避免与 JEC 自带 PinIn 的
    // JPMS 模块重复导出冲突（Modules pinin and PinIn export package ... to module pinyin4j）。
    compileOnly 'me.towdium:pinin:1.6.0'
    compileOnly "curse.maven:just-enough-characters-250702:6679735"
    runtimeOnly "curse.maven:just-enough-characters-250702:6679735"

    runtimeOnly "maven.modrinth:extendedae-plus:1.21.1-1.4.3"
}

// 展开 ${} 占位符
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
                             neoforge_version    : neoforge_version, neoforge_version_range: neoforge_version_range,
                             loader_version_range: loader_version_range,
                             mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors         : mod_authors, mod_description: mod_description,]

    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
